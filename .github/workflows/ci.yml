name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # required by dorny/paths-filter to list changed files on pull requests

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            api:
              - 'services/api/**'
              - 'docker-compose.yml'
              - '.env.example'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - '.env.example'
              - '.github/workflows/ci.yml'
            desktop:
              - 'apps/desktop/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/desktop-release.yml'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      # Auth tests create and migrate a throwaway `<db>_test` database on this server.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: interview_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d interview_assistant"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci-only-password@localhost:5432/interview_assistant
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # M-10 (D-77): the Windows package is built and verified on every desktop change, UNSIGNED. Signing
  # secrets are never available here (this workflow also runs for pull requests); signed releases
  # use the protected desktop-release.yml workflow only.
  desktop-windows:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Includes the release-tooling tests, which create real throw-away PFX files on Windows.
      - run: npm test
      # Unsigned internal build: type-check, build, package, then verify (version, x64, metadata,
      # fuses, CSP, unsigned status) and write SHA256SUMS.txt.
      - run: node scripts/release/package-release.mjs
        env:
          REQUIRE_SIGNING: "false"
      - run: node scripts/release/verify-build.mjs --check-sums
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-UNSIGNED-internal-${{ github.sha }}
          path: |
            apps/desktop/release/*-Windows-x64.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/SHA256SUMS.txt
            apps/desktop/release/BUILD-KIND.txt
          if-no-files-found: error
          retention-days: 7
